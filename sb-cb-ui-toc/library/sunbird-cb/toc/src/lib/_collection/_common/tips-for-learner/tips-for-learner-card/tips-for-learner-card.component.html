<div class="tips-container"
    *ngIf="randomlearnAdvisoryObj && config?.uiVisibility?.rightPanel?.learnerAdvisory?.visible !== false">
    <div class="tips-header">
        <p class="mat-subheading-1 margin-bottom-none"
            *ngIf="config?.uiVisibility?.rightPanel?.learnerAdvisory?.title !== false">Tips for Learners</p>
        <div class="ml-4 pl-2 view-more ws-mat-default-text ng-star-inserted"
            *ngIf="config?.uiVisibility?.rightPanel?.learnerAdvisory?.readMoreLink !== false">
            <a class="flex ws-mat-default-text items-center justify-center mat-body-1 cursor-pointer"
                (click)="showAllTips()">
                <span class="ws-mat-default-text">{{ 'career.readMore' | translate }}</span>
                <mat-icon class="ws-mat-default-text" color="accent" role="img"
                    aria-hidden="true">navigate_next</mat-icon>
            </a>
        </div>
    </div>
    <div class="tip-content">
        <div class="background" *ngIf="config?.uiVisibility?.rightPanel?.learnerAdvisory?.icon !== false">
            <img class="book-icon" src="{{randomlearnAdvisoryObj?.contentImg}}"
                alt="{{randomlearnAdvisoryObj?.content}}">
        </div>
        <div class="tip-data" *ngIf="config?.uiVisibility?.rightPanel?.learnerAdvisory?.tipText !== false">
            <p>{{randomlearnAdvisoryObj?.content}}</p>
        </div>
    </div>
</div>
