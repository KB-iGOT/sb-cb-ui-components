<!-- ============================================================
   Continue Learning Wrapper
   Two child cards side by side. The section heading + "View All"
   render inside the in-progress card itself.
   ============================================================ -->
<div class="cl-container" role="region" aria-label="Continue learning">

  <!-- Two cards row -->
  <div class="cl-cards-row">
    <!-- In Progress card — hidden when disabled, or when not loading and no course data -->
    @if (showInProgress() && (isInProgressLoading() || inProgressCourse)) {
    <div class="cl-card-wrap" [attr.aria-busy]="isInProgressLoading()"
      [attr.aria-label]="isInProgressLoading() ? 'Loading in-progress course' : null">
      <sb-uic-in-progress-card-v2 [course]="inProgressCourse" [isLoading]="isInProgressLoading()"
        [showViewAll]="showViewAll()" (viewAllClicked)="viewAll()">
      </sb-uic-in-progress-card-v2>
    </div>
    }

    <!-- Weekly Claps card — spans full width automatically when left card is absent -->
    @if (showWeeklyClaps()) {
    <div class="cl-card-wrap" [attr.aria-busy]="isWeeklyLoading"
      [attr.aria-label]="isWeeklyLoading ? 'Loading weekly claps' : null">
      <sb-uic-weekly-claps-card-v2 [insightsData]="insightsData" [weeklyData]="weeklyData" [isLoading]="isWeeklyLoading">
      </sb-uic-weekly-claps-card-v2>
    </div>
    }
  </div>

</div>
