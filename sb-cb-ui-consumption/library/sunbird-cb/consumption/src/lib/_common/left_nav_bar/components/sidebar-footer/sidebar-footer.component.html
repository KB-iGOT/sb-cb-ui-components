<div class="footer-content flex items-center py-1" [ngClass]="isOpen ? 'px-6' : 'justify-center'">
  @for (item of itemsList; track item.code) {
  <!-- Collapsed sidebar hides .item-text, so the tooltip is the only thing naming the icon.
       Suppressed when open, where the label is already visible next to it. -->
  <a class="footer-item w-full" (click)="onItemClick(item)"
    [matTooltip]="translateLabels(item.label, 'leftNavBar', item.disableTranslate)" matTooltipPosition="right"
    [matTooltipDisabled]="isOpen" [attr.aria-label]="translateLabels(item.label, 'leftNavBar', item.disableTranslate)">
    <div class="flex items-center" [ngClass]="isOpen ? 'justify-between' : 'justify-center'">
      <!-- @if (isOpen) { -->
      <div class="flex gap-1 items-center">
        @if (item.iconName || item.iconUrl) {
        <div class="footer-icon-content flex items-center justify-center">
          @if (item?.iconName) {
          <mat-icon class="footer-icon" aria-hidden="true">{{ item?.iconName }}</mat-icon>
          } @else if (item?.iconUrl) {
          <span class="icon-svg w-5 h-5" [style.mask-image]="'url(/assets/icons/' + item?.iconUrl + '.svg)'"
            [style.-webkit-mask-image]="'url(/assets/icons/' + item?.iconUrl + '.svg)'" role="presentation"></span>
          }
        </div>
        }
        @if (isOpen) {
        <div class="item-text">{{ translateLabels(item.label, 'leftNavBar', item.disableTranslate) }}</div>
        }
      </div>
      <!-- } -->
      <!-- @if (item.infoIcon) {
      <mat-icon class="info-icon"
        [attr.title]="item.infoText ? translateLabels(item.infoText, 'leftNavBar', item.disableTranslate) : ''">
        {{ item.infoIcon }}
      </mat-icon>
      } -->
    </div>
  </a>
  }
</div>
