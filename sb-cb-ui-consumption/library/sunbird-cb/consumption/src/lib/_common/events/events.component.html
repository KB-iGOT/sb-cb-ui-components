<div class="event-container">

    <div class="flex flex-wrap items-center mb-4 mt-2 gap-2">
        <div class="event-title flex-1">
            {{object?.title}}
        </div>
        <button *ngIf="isEdit && isEditable" mat-icon-button class="edit-icon" aria-label="Edit Events"
            (click)="onEdit()">
            <mat-icon>edit</mat-icon>
        </button>
        <div class="flex gap-4 items-center">
            <div class="events-select">
                <select (change)="getEvents($event)">
                    <option value="{{d?.startDate}}" *ngFor="let d of daysBetween"
                        [selected]="currentDay === d.startDate">{{d?.diplayFormat}}</option>
                </select>
            </div>
        </div>
    </div>
    <div class="grid grid-cols-1 gap-4">
        <!-- Scrollable wrapper activates only after Show All is clicked -->
        <div class="events-card-wrapper" [class.events-card-wrapper--expanded]="showAllEvents">
            <div *ngIf="!loader">
                <div *ngIf="events?.length > 0">
                    <div *ngFor="let event of showAllEvents ? events : (events | slice:0:(object?.maxContent || 3))">
                        <sb-uic-event-card [objectData]="object" [eventDetails]="event"
                            [loader]="loader"></sb-uic-event-card>
                    </div>
                </div>
                <div *ngIf="events?.length === 0">
                    <div class="flex item-center justify-center p-5 no-events">
                        No events exist.
                    </div>
                </div>
            </div>
            <div *ngIf="loader && events?.length === 0">
                <div *ngFor="let event of [1,2,3]">
                    <sb-uic-event-card [objectData]="object" [eventDetails]="event"
                        [loader]="loader"></sb-uic-event-card>
                </div>
            </div>
        </div>
    </div>

    <!-- Show All / Show Less toggle — only when total events exceed maxContent -->
    <div class="flex justify-center mt-4"
        *ngIf="events?.length > (object?.maxContent || 3)">
        <a class="flex ws-mat-default-text items-center justify-center mat-body-1 cursor-pointer"
            (click)="toggleShowAll()">
            <span *ngIf="!showAllEvents" class="flex items-center gap-1">
              Show All <mat-icon style="font-size:18px;width:18px;height:18px;line-height:18px">keyboard_arrow_down</mat-icon>
            </span>
            <span *ngIf="showAllEvents" class="flex items-center gap-1">
              Show Less <mat-icon style="font-size:18px;width:18px;height:18px;line-height:18px">keyboard_arrow_up</mat-icon>
            </span>
        </a>
    </div>

</div>
