<div class="w-full">
  <!-- Loading Skeletons -->
  @if (loading()) {
  <sb-uic-carousel [items]="skeletonArray()" [cardWidth]="280" [gap]="16" [showNavigation]="false" [showDots]="false">
    <ng-template #carouselCard let-item let-index="index">
      <div class="animate-pulse bg-gray-200 rounded-lg h-64 w-full"></div>
    </ng-template>
  </sb-uic-carousel>
  }

  <!-- Cards -->
  @if (!loading() && cards()?.length) {
  <sb-uic-carousel [items]="cards()" [cardWidth]="280" [gap]="16">
    <ng-template #carouselCard let-item let-index="index">
      @switch (getCardType()) {
      @case (CardType.CourseCard) {
      <sb-uic-card-course-v2 [content]="item" [config]="contentConfig()"
        [isLoading]="loading()"></sb-uic-card-course-v2>
      }
      }
    </ng-template>
  </sb-uic-carousel>

  <!-- View All -->
  @if (shouldShowViewAll() && getViewAllUrl()) {
  <div class="flex justify-end mt-3 view-all-content">
    <a (click)="redirectViewAll(getViewAllUrl()?.path, getViewAllUrl()?.queryParams, getViewAllUrl()?.f)"
      class="text-sm flex items-center justify-center font-medium view-all-btn hover:text-blue-800 hover:cursor-pointer">
      View All
    </a>
  </div>
  }
  }

  <!-- No Data -->
  @if (!loading() && !cards()?.length) {
  <sb-uic-carousel [items]="dummyCards()" [cardWidth]="280" [gap]="16">
    <ng-template #carouselCard let-item let-index="index">
      <!-- <sb-uic-card-course-strip [card]="item" /> -->
    </ng-template>
  </sb-uic-carousel>
  }
</div>
