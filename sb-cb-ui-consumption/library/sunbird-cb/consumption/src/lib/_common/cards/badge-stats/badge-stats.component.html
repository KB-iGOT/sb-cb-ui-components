<div class="stats-row grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">

  <div class="stat-card bg-white rounded-xl shadow-sm p-4 flex flex-col gap-2 w-86 h-30" *ngFor="let stat of stats">

    <div class="stat-label text-sm font-semibold text-gray-600">
      {{ stat.label }}
    </div>

    <div class="stat-icon w-12 h-12 rounded-lg flex items-center justify-center self-end" [ngClass]="stat.iconClass">

      <img class="w-6 h-6" [src]="stat.icon" alt="icon" />
    </div>

    <div class="stat-value text-2xl font-semibold">
      {{ stat.value }}
    </div>

  </div>

</div>
