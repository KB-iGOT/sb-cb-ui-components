<div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Sidebar -->
    <div class="lg:w-64">
      <ng-container>
         <d-v2-similar-community-card (communityClick)="onCommunityClick($event)" ></d-v2-similar-community-card> 
      </ng-container>
    </div>
    <!-- Main Content -->
    <div class="flex-1">
       <div class="md:col-span-2">
          <div class="mb-6">
             <div class="relative flex community-search" >
               <input
               #searchInput id="searchInput"
                  type="text"
                  [(ngModel)]="localSearchTextValue"
                  placeholder="Search Topics"
                  class="w-full px-4 py-2 pl-10  rounded-full "
                  />
               <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                  search
               </mat-icon>
            </div>
          </div>
       </div>
       <!-- <div class="info-text">
        <h2  *ngIf="searchTextValue">Showing results for <span >"{{searchTextValue}}"</span></h2>
        <h2 *ngIf="topicName">Communities under <span >"{{topicName}}"</span> ({{communityDataList?.length}})</h2>
         
       </div> -->
       <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="!topicDataLoading">
        <div *ngFor="let topic of topicDataList  | filterSearch: localSearchTextValue" >
         <d-v2-topic-card [topicCommunityCount]="topic?.count" [isLoading]="false" (click)="topicCardMethod(topic)"
             [topicTitle]="topic?.value">
         </d-v2-topic-card>
        </div>
     </div>
    </div>
    <!-- Right Sidebar -->
    <div class="lg:w-64">
        <d-v2-sort-by [sortData]="sortData" (sortOptionSelection)="sortOptionSelection($event)"></d-v2-sort-by>
    </div>
 </div>
