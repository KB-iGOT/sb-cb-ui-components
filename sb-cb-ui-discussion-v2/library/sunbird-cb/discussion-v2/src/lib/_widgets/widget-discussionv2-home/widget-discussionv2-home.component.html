<div class="container mx-auto px-4 py-6">
  <div class="flex flex-col lg:flex-row gap-8">
     <!-- Left Sidebar -->
     <div class="lg:w-64">
      <d-v2-shortcuts [data]="shortCutData"></d-v2-shortcuts>
     </div>
     <!-- Main Content -->
     <div class="flex-1">
        <div class="md:col-span-2">
           <div class="mb-6">
              <div class="relative flex community-search">
                 <input
                    type="text"
                    (keydown.enter)="onSearch($event)"
                    placeholder="Search Communities"
                    class="w-full px-4 py-2 pl-10  rounded-full "
                    />
                 <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                    search
                 </mat-icon>
                 <!-- <Search class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" /> -->
              </div>
           </div>
        </div>
        <mat-tab-group animationDuration="0ms">
           <mat-tab label="Discover">
              <div class="py-4">
                 <div class="flex justify-between items-center mb-4 community-groups">
                    <h2 class="text-xl font-medium title margin-remove">Government and Public Administration Communities (8)</h2>
                    <a class="show-more flex items-center" (click)="showAllCommunitiesByTopic(1029)">
                      <span>Show all</span> 
                      <mat-icon>chevron_right</mat-icon>
                    </a>
                 </div>
                 <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div *ngFor="let community of communities">
                       <d-v2-community-card></d-v2-community-card>
                    </div>
                 </div>
              </div>
           </mat-tab>
           <mat-tab label="Your Communities (12)"></mat-tab>
           <mat-tab label="Pending Community Request (4)"></mat-tab>
        </mat-tab-group>
     </div>
     <!-- Right Sidebar -->
     <div class="lg:w-80">
      <d-v2-trending-discussions [data]="trendingDiscussions" [expandCard]="true"></d-v2-trending-discussions>
      <d-v2-trending-tags [trendingTags]="trendingTags"></d-v2-trending-tags>
     </div>
  </div>
</div>
