<div class="container mx-auto py-6 ">
   <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
       <!-- Column 1 -->
       <div class=" p-2 rounded-lg md:col-span-3">
           <!-- <d-v2-shortcuts [data]="shortCutData"></d-v2-shortcuts> -->
       </div>
   
       <!-- Column 2 (Double Width on Large Screens) -->
       <div class=" p-2 rounded-lg md:col-span-6">
         <div class="md:col-span-2">
            <div class="mb-6">
               <div class="relative flex community-search">
                  <input
                     type="text"
                     (keydown.enter)="onSearch($event)"
                     placeholder="Search Communities"
                     class="w-full px-4 py-2 pl-10  rounded-full "
                     />
                  <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                     search
                  </mat-icon>
                  <!-- <Search class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" /> -->
               </div>
            </div>
         </div>
         <div class="py-4">
            <div class="flex justify-between items-center mb-4 community-groups">
               <h2 class="text-xl font-medium title margin-remove">All Topics <span *ngIf="topicDataList?.length">({{topicDataList?.length}})</span></h2>
               <a class="show-more flex items-center" *ngIf="topicDataList?.length > 3" (click)="showAllCommunitiesByTopic(1029)">
                 <span>Show all</span> 
                 <mat-icon>chevron_right</mat-icon>
               </a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="!topicDataLoading">
               <div *ngFor="let topic of topicDataList" >
                <d-v2-topic-card [topicCommunityCount]="topic?.count" [isLoading]="false" (click)="topicCardMethod(topic)"
                    [topicTitle]="topic?.value">
                </d-v2-topic-card>
               </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="topicDataLoading">
                <d-v2-topic-card  [isLoading]="true"></d-v2-topic-card>
                <d-v2-topic-card  [isLoading]="true"></d-v2-topic-card>
                <d-v2-topic-card  [isLoading]="true"></d-v2-topic-card>
            </div>
         </div>
         <mat-tab-group animationDuration="0ms" class="custom-tab-container ">
            <mat-tab label="Discover">
               <ng-container *ngIf="topicDataList?.length">
                  <d-v2-discover [topicDataList]="topicDataList" (showAllByTopic)="showAllCommunitiesByTopic($event)" (cardClick)="onCardClick($event)"></d-v2-discover>
               </ng-container>
               
            </mat-tab>
            <mat-tab label="Your Communities">
             <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
                <div  *ngFor="let item of userEnrollDetailsData">
                    <d-v2-community-card [community]="item"   (click)="onCardClick(item)"></d-v2-community-card>
                </div>
             </div>
            </mat-tab>
            <!-- <mat-tab label="Pending Community Request (12)"></mat-tab> -->
         </mat-tab-group>
           
       </div>
   
       <!-- Column 3 -->
       <div class=" p-2 rounded-lg md:col-span-3">
           <d-v2-trending-discussions ></d-v2-trending-discussions>
       </div>
   </div>
</div>
