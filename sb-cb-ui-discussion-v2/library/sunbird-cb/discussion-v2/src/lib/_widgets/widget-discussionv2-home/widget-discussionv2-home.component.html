<div class="container mx-auto py-6 ">
   <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
       <!-- Column 1 -->
       <div class=" p-2 rounded-lg md:col-span-3">
           <!-- <d-v2-shortcuts [data]="shortCutData"></d-v2-shortcuts> -->
       </div>
   
       <!-- Column 2 (Double Width on Large Screens) -->
       <div class=" p-2 rounded-lg md:col-span-6">
         <div class="md:col-span-2">
            <div class="mb-6">
               <div class="relative flex community-search">
                  <input
                     type="text"
                     (keydown.enter)="onSearch($event)"
                     placeholder="Search Communities"
                     class="w-full px-4 py-2 pl-10  rounded-full "
                     />
                  <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                     search
                  </mat-icon>
                  <!-- <Search class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" /> -->
               </div>
            </div>
         </div>
         <mat-tab-group animationDuration="0ms" class="custom-tab-container ">
            <mat-tab label="Discover">
               <d-v2-discover (showAllByTopic)="showAllCommunitiesByTopic($event)" (cardClick)="onCardClick($event)"></d-v2-discover>
            </mat-tab>
            <mat-tab label="Your Communities">
             <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
                <div  *ngFor="let item of userEnrollDetailsData">
                    <d-v2-community-card [community]="item"   (click)="onCardClick(item)"></d-v2-community-card>
                </div>
             </div>
            </mat-tab>
            <!-- <mat-tab label="Pending Community Request (12)"></mat-tab> -->
         </mat-tab-group>
           
       </div>
   
       <!-- Column 3 -->
       <div class=" p-2 rounded-lg md:col-span-3">
           <d-v2-trending-discussions ></d-v2-trending-discussions>
       </div>
   </div>
</div>
