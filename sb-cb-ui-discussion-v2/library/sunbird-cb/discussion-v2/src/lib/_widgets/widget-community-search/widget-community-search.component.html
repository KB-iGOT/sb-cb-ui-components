<div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Sidebar -->
    <div class="lg:w-64">
     left
    </div>
    <!-- Main Content -->
    <div class="flex-1">
       <div class="md:col-span-2">
          <div class="mb-6">
             <div class="relative flex community-search">
                <input
                   type="text"
                   [(ngModel)]="searchTextValue"
                   (keydown.enter)="onSearch($event)"
                   placeholder="Search Communities"
                   class="w-full px-4 py-2 pl-10  rounded-full "
                   />
                <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                   search
                </mat-icon>
             </div>
          </div>
       </div>
       <div class="info-text" *ngIf="searchTextValue">
        <h2>Showing results for <span >"{{searchTextValue}}"</span></h2>
       </div>
       <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let community of communityDataList">
            <d-v2-community-card [community]="community" (click)="onCardClick(community)"></d-v2-community-card>
        </div>
     </div>
    </div>
    <!-- Right Sidebar -->
    <div class="lg:w-64">
        right
    </div>
 </div>
