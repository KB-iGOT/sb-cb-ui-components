<div class="container landing-page-container">
    <div class="tab-container-landing-page">
        <mat-tab-group  (selectedTabChange)="onTabChange($event)"  class="tab-container-landing-page" [mat-stretch-tabs]="false"  mat-align-tabs="center">
            <ng-container *ngFor="let tab of mainTabs; let i = index">
                <mat-tab [id]="tab?.id">
                    <ng-template mat-tab-label>
                        <div class="flex items-center gap-2 mat-label-block">

                        <mat-icon>{{tab?.icon}}</mat-icon>
                        <span class=" margin-remove" [ngClass]="{'mat-subheading-2': selectedTabId === tab?.id,'mat-body-2': selectedTabId !== tab?.id}">{{tab?.label}}</span>
                        </div>
                    </ng-template>
                </mat-tab>
            </ng-container>
        </mat-tab-group>
    </div>
    <div class="container mx-auto  mt-6">
        <div class="grid grid-cols-1 px-4 md:px-0 md:grid-cols-12 gap-0 md:gap-4">
            <!-- Column 1 -->
            <div class=" rounded-lg col-span-1 md:col-span-3">
                 <div class="hidden  md:block">
                    <d-v2-similar-community-card ></d-v2-similar-community-card> 
                 </div>
            </div>
        <!-- 282,372 -->
            <!-- Column 2 (Double Width on Large Screens) -->
            <div class=" rounded-lg col-span-1 md:col-span-6">
                <div class="">
                    <ng-container *ngIf="selectedTabId === 'feeds'">
                        feeds
                    </ng-container>

                    <ng-container *ngIf="selectedTabId === 'communities'">

                        <div class="md:col-span-2">
                            <div class="mb-6">
                            <div class="relative flex community-search">
                                <input
                                    type="text"
                                    (keydown.enter)="onSearch($event)"
                                    placeholder="Search Communities"
                                    class="w-full px-4 py-2 pl-10  rounded-full "
                                    />
                                <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                                    search
                                </mat-icon>
                                <!-- <Search class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" /> -->
                            </div>
                            </div>
                        </div>
                        <div class="py-4" *ngIf="topicDataList?.length">
                            <div class="flex justify-between items-center mb-4 community-groups">
                               <h2 class="text-xl font-medium title margin-remove">All Topics <span *ngIf="topicDataList?.length">({{topicDataList?.length}})</span></h2>
                               <a class="show-more flex items-center cursor-pointer" *ngIf="topicDataList?.length > 3" (click)="showAllTopicsMethod()">
                                 <span>Show all</span> 
                                 <mat-icon>chevron_right</mat-icon>
                               </a>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-1 lg:grid-cols-1 gap-4" *ngIf="!topicDataLoading">
                               <div class="flex md:block overflow-x-auto scrollbar-hide -mx-2 px-2">
                                  <div class="flex md:block space-x-4 md:space-x-7">
                                     <div *ngFor="let topic of topicDataList | slice:0:3" class="flex-shrink-0 w-[280px] md:w-auto">
                                        <d-v2-topic-card [topicCommunityCount]="topic?.count" [isLoading]="false" (click)="topicCardMethod(topic)"
                                            [topicTitle]="topic?.value">
                                        </d-v2-topic-card>
                                     </div>
                                  </div>
                               </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="topicDataLoading">
                                <d-v2-topic-card  [isLoading]="true"></d-v2-topic-card>
                                <d-v2-topic-card  [isLoading]="true"></d-v2-topic-card>
                                <d-v2-topic-card  [isLoading]="true"></d-v2-topic-card>
                            </div>
                         </div>
                        <d-v2-discover (popularCommunityClick)="popularCommunity($event)" [topicDataList]="topicDataList" (showAllByTopic)="showAllCommunitiesByTopic($event)" (cardClick)="onCardClick($event)"></d-v2-discover>
                    </ng-container>

                    <ng-container *ngIf="selectedTabId === 'my_communities'">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4"  *ngIf="userEnrollDetailsData?.length; else noEnrolledCommunity">
                            <div  class="flex justify-center md:block" *ngFor="let item of userEnrollDetailsData">
                               <d-v2-community-card [community]="item"   (click)="onCardClick(item)"></d-v2-community-card>
                            </div>
                        </div>
    
                      <ng-template #noEnrolledCommunity>
                         <ng-container [ngTemplateOutlet]="noData" [ngTemplateOutletContext]="{'iconName':'forum', 'noTextValue':'Join a community to get started!'}"></ng-container>
                      </ng-template>
                    </ng-container>
                </div>
            </div>
        
            <!-- Column 3 -->
            <div class=" rounded-lg col-span-1 md:col-span-3">
                <div class="hidden  md:block">
                    <d-v2-trending-discussions [expandCard]="true"></d-v2-trending-discussions>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #noData let-iconName="iconName" let-noTextValue="noTextValue">
    <div class="mt-8">
       <d-v2-no-data [iconName]="iconName" [noText]="noTextValue"></d-v2-no-data>
    </div>
 </ng-template>
