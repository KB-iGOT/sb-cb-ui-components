<div class="trending-wrapper">
    <d-v2-card-toggle (hideCardBody)="hideCardBody = $event" [toggleViewBoolean]="expandCard">
        <div headderBlock>
           <div class="headding">Trending Discussions</div>
        </div>
        <div contentBodyBlock>
            <div class="space-y-4 pt-4" *ngIf="posts?.length ;else noData">
                <div *ngFor="let discussion of posts;let isFirst = first" class="flex flex-wrap items-start space-x-3">
                    <hr class="divider w-full" *ngIf="!isFirst" >
                    <div class="trending-data margin-remove cursor-pointer" (click)="navigateToPost(discussion)">
                        <div class="flex items-center justify-between mb-4 user-info w-full">
                                <div class="flex items-center w-3/4">
                                    <d-v2-avatar-photo [size]="'s'"
                                        [customeClass]="'margin-remove'"
                                        [name]="discussion?.createdBy?.first_name"
                                        [photoUrl]="discussion?.createdBy?.user_profile_img_url || ''"></d-v2-avatar-photo>
                                    <div class="ml-2 user-name">
                                        <span class="font-medium text-start">{{discussion?.createdBy?.first_name}}</span>
                                    </div>
                                </div>
                                <div class="flex items-center justify-end w-1/4 text-sm text-gray-600 post-time">
                                    <span>{{discussion?.createdOn| pipeRelativeTime}}</span>
                                </div>
                        </div>
                        <div class="post-data">
                            <p [innerHtml]="discussion?.description" ></p>
                        </div>
                        <div class="mt-2 flex items-center justify-start space-x-4 text-sm text-gray-600 w-4/5 post-details">
                            <span class="flex items-center">
                                <mat-icon class="mat-icon ">thumb_up</mat-icon>
                                <span class="ml-2">{{discussion?.upVoteCount || 0}}</span> 
                            </span>
                            <!-- <span class="mx-2">•</span>
                            <span class="flex items-center">
                                <mat-icon class="mat-icon ">visibility</mat-icon>
                                <span class="ml-2">{{discussion?.downVoteCount || 0}}</span>
                            </span> -->
                            <span class="mx-2">•</span>
                            <span class="flex items-center">
                                <mat-icon class="mat-icon ">chat_bubble</mat-icon>
                                <span class="ml-2">{{discussion?.answerPostCount || 0}}</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <ng-template #noData >
                <div class="mt-8">
                   <d-v2-no-data [iconName]="'forum'" [noText]="'No data'"></d-v2-no-data>
                </div>
             </ng-template>
        </div>
    </d-v2-card-toggle>
</div>
