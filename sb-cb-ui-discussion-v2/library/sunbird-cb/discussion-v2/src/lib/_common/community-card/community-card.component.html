<div class="community-card">
    <div class="card-img-block">
        <img src="https://portal.dev.karmayogibharat.net/assets/public/content/do_1139557259796398081160/artifact/do_1139557259796398081160_1703579832066_1000_f_619659267_wspvvzailzypsdkpbb50qgj5zcchjoc6.jpg" alt="">
        <div class="community-type flex items-center">
            <mat-icon class="mat-icon ">lock</mat-icon>
            <span class="title">Private</span>
        </div>
    </div>
    <div class="card-details-block">
        <p class="community-title">{{community?.communityName}}</p>
        <div class="flex items-center justify-between community-info">
            <p>{{community?.countOfPeopleJoined}} Members</p>
            <span class="mx-2">•</span>
            <p>10K Posts</p>
        </div>
        <div class="flex items-center justify-start community-owner-info">
            <div class="owner-icon mr-2">
                <img src="https://portal.dev.karmayogibharat.net/assets/public/content/do_1139557259796398081160/artifact/do_1139557259796398081160_1703579832066_1000_f_619659267_wspvvzailzypsdkpbb50qgj5zcchjoc6.jpg" alt="">
            </div>
            <p class="owner-name margin-remove">By MDO Name</p>
        </div>
    </div>
</div>
