<div class="comminity-details">
    <d-v2-card-toggle (hideCardBody)="hideCardBody = $event" [toggleViewBoolean]="expandCard">
        <div headderBlock>
           <div class="headding">Similar to Your Communities</div>
        </div>
        <div contentBodyBlock>
            <div class="space-y-4 pt-4" *ngIf="communityData && communityData?.length; else noData">
                <ng-container *ngFor="let community of communityData">
                    <div class="flex gap-4 items-center comminity-details cursor-pointer" (click)="communicityClickMethod(community)">
                        <d-v2-avatar-photo [size]="'s'"
                            [name]="community?.communityName"
                            [photoUrl]="community?.posterImageUrl || ''" >
                        </d-v2-avatar-photo>
                        <div class="community-name">
                            <span>{{community?.communityName}}</span>
                        </div>
                    </div>
                </ng-container>
                
            </div>
            <ng-template #noData>
                <div class="mt-4">
                    <d-v2-no-data [iconName]="'forum'" [noText]="'No Communities'"></d-v2-no-data>
                </div>
            </ng-template>
        </div>
    </d-v2-card-toggle>
</div>
