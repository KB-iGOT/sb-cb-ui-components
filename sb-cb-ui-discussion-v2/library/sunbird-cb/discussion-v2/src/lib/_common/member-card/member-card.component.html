<mat-card class="member-card-wrapper relative">
    <div class="absolute photo-block">
        <d-v2-avatar-photo [size]="'l'"
                    [name]="memeberData?.first_name ||  memeberData.firstName"
                    [photoUrl]="memeberData?.user_profile_img_url || memeberData?.profileDetails?.profileImageUrl || ''" >
    </d-v2-avatar-photo>
    </div>
    <div class="member-info">
        <div class="member-name">
            <span class="">{{memeberData?.first_name || memeberData.firstName}}</span>
        </div>
        <div class="member-role">
            <span class="">{{memeberData?.designation || memeberData?.profileDetails?.employmentDetails?.departmentName}}</span>
        </div>
        <div class="flex items-center justify-center mt-2">
            <!-- <button  class="connect-btn">
                <mat-icon>person_add</mat-icon>
                <span>Connect</span>
            </button> -->
        </div>
    </div>

</mat-card>
