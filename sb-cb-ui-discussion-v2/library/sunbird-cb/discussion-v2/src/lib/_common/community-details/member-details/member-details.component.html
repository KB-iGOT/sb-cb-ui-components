<mat-card class="members-wrapper mt-4">
    <div class="mb-6">
        <div class="relative flex community-search">
           <input
              type="text"
              (keydown.enter)="onSearch($event)"
              placeholder="Search Members"
              class="w-full px-4 py-2 pl-10  rounded-full "
              />
           <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
              search
           </mat-icon>
           <!-- <Search class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" /> -->
        </div>
     </div>
    <div class="member-title">
        <h2>Members</h2>
    </div>
    <div>
        <div class="flex justify-start">
            <div class="flex gap-2 flex-wrap justify-start">
                <ng-container *ngFor="let member of communityMembersList">
                    <d-v2-member-card ></d-v2-member-card>
                </ng-container>
            </div>
        </div>
    </div>
</mat-card>
