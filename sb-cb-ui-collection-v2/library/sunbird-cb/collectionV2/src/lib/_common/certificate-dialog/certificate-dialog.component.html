<div class="flex flex-1" style="position: relative;">
    <ws-widget-svg-editor *ngIf="xmlData" [(svg)]="xmlData"></ws-widget-svg-editor>
    <img *ngIf="url" [src]="url| pipeSafeSanitizer: 'url'" alt="'Certificate'" class="certificate-banner-image">
    <button mat-icon-button class="close-button" [mat-dialog-close]="true">
        <mat-icon class="close-icon" color="warn">close</mat-icon>
    </button>
</div>
