<div class="role-mapping-container">
  <!-- Header Section -->
  <div class="header-section">
    <h1 class="main-title">Role Mapping</h1>
  </div>

  <!-- Main Form Card -->
  <div class="form-card">
    <div class="form-header">
      <h2 class="form-title">Choose the ministry or organisation for role mapping</h2>
      <button mat-raised-button color="primary" class="submit-btn" 
              (click)="onGenerateRoleMapping()" 
              [disabled]="roleMappingForm.invalid || isGenerating">
        Submit
      </button>
    </div>

    <form [formGroup]="roleMappingForm" class="role-mapping-form">
      
      <!-- Organization Type Selection - Radio Buttons -->
      <div class="organization-type-section">
        <div class="radio-group">
          <mat-radio-group formControlName="type" class="radio-buttons">
            <mat-radio-button value="Centre" class="radio-option">Centre</mat-radio-button>
            <mat-radio-button value="State" class="radio-option">State</mat-radio-button>
            <mat-radio-button value="Ministry" class="radio-option">Ministry</mat-radio-button>
          </mat-radio-group>
        </div>
      </div>

      <!-- Ministry Selection -->
      <div class="form-field-section">
        <div class="field-container">
          <label class="field-label">
            Ministry <span class="required-asterisk">*</span>
          </label>
          <mat-form-field appearance="outline" class="custom-select">
            <mat-select formControlName="ministry" 
                       placeholder="Select Ministry"
                       [disabled]="isLoading || !typeControl?.value">
              <mat-option value="">Select Ministry</mat-option>
              <mat-option *ngFor="let ministry of ministries" [value]="ministry.id">
                {{ ministry.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <!-- Sector Selection -->
      <div class="form-field-section">
        <div class="field-container">
          <label class="field-label">
            Sector <span class="required-asterisk">*</span>
          </label>
          <mat-form-field appearance="outline" class="custom-select">
            <mat-select formControlName="sector" 
                       placeholder="Select Sector"
                       [disabled]="isLoading || !ministryControl?.value">
              <mat-option value="">Select Sector</mat-option>
              <mat-option *ngFor="let sector of sectors" [value]="sector.id">
                {{ sector.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <!-- Additional Details Textarea -->
      <div class="form-field-section">
        <div class="field-container">
          <mat-form-field appearance="outline" class="textarea-field">
            <textarea matInput 
                     placeholder="Additional details" 
                     formControlName="additionalDetails"
                     rows="4"
                     maxlength="100"></textarea>
          </mat-form-field>
          <div class="character-count">
            {{ (roleMappingForm.get('additionalDetails')?.value || '').length }}/100
          </div>
        </div>
      </div>

    </form>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
</div>
